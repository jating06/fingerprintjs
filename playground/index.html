<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title><%= htmlWebpackPlugin.options.title %></title>
  <link rel="icon" type="image/x-icon" href="<%= require('../resources/favicon.ico').default %>" />
  <style>
    /* The full-height solution for IE 11 is taken from https://gist.github.com/palicko/26b327cd2198e52c25b13485b4dd02bc */
    html {
      display: flex;
    }
    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      font-family: sans-serif;
    }
    .content {
      flex: 1;
      width: 100%;
      max-width: 60em;
      box-sizing: border-box;
      margin: 0 auto;
      padding: 1.25em;
      display: flex;
      flex-direction: column;
    }
    header {
      flex: none;
      margin-bottom: 1.2vh;
    }
    header img {
      height: 5vh;
      max-width: 100%;
    }
    button {
      border: none;
      background: #f04405;
      color: #fff;
      font: inherit;
      font-size: 88%;
      font-weight: 600;
      line-height: 1.2;
      border-radius: 0.57em;
      cursor: pointer;
      margin: 0;
      padding: 0.85em 1.7em;
      text-align: center;
      outline: none;
      transition: all 0.25s ease-out;
    }
    button:hover {
      background: #8c2703;
    }
    button:active {
      background: #cd3f10;
    }
    button:disabled {
      cursor: not-allowed;
      background: #e9987c;
    }
    .buttons {
      flex: none;
    }
    .buttons button {
      margin: 0 0.8em 0.8em 0;
    }
    .outputHolder {
      flex: 1;
      min-height: 4em;
      position: relative;
    }
    .output {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: #282c34;
      box-shadow: 0 0 1.25em rgba(0, 0, 0, 0.2);
      border-radius: 0.7em;
      padding: 1em 1.25em;
      color: #e1e5ea;
      overflow: auto;
    }
    .output pre {
      padding: 0;
      margin: 0;
      font-size: 100%;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .output pre.big {
      font-size: 123%;
    }
    .output pre.giant {
      font-size: 200%;
    }
    .output .heading {
      font-size: 81%;
      margin-bottom: 0.5em;
      color: #eac4a6;
    }
    .output .heading:not(:first-child) {
      margin-top: 2em;
    }
    .output .comment {
      font-size: 87%;
      margin-top: 0.6em;
      color: #a3a7ad;
    }
    .output a {
      color: inherit;
      -webkit-text-decoration: dotted underline;
      text-decoration: dotted underline;
    }
    .output a:hover {
      color: inherit;
      -webkit-text-decoration: underline;
      text-decoration: underline;
    }

    /* Overlay Styles */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .overlay-content {
      background-color: #fff;
      padding: 2em;
      border-radius: 0.7em;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    
    .overlay-content h2 {
      margin-top: 0;
      color: #333;
      margin-bottom: 1em;
    }
    
    .overlay-content input {
      width: 100%;
      padding: 0.8em;
      margin-bottom: 1.5em;
      border: 1px solid #ccc;
      border-radius: 0.4em;
      font-size: 1em;
      box-sizing: border-box;
    }
    
    .overlay-content button {
      /* Inherit styles from existing buttons */
      margin: 0 auto;
      display: block;
    }
    
    .error-message {
      color: #f04405;
      margin-bottom: 1em;
      font-size: 0.9em;
      display: none;
    }
    
    /* Hide main content until email is provided */
    .content-hidden {
      display: none;
    }

    @media (max-width: 768px), (max-height: 568px) {
      .content {
        padding: 1em;
      }
      button {
        padding: 0.7em 1em;
      }
      .output {
        padding: 0.75em 1em;
      }
      .overlay-content {
        padding: 1.5em;
      }
    }
  </style>
</head>
<body>
  <!-- Main content initially hidden -->
  <div class="content content-hidden">
    <header>
      <a href="<%= require('../package.json').homepage %>">
      </a>
    </header>
    <div class="buttons">
      <button disabled id="debugCopy">Copy Debug Data</button>
      <button disabled id="debugShare">Share Debug Data</button>
    </div>
    <div class="outputHolder">
      <section class="output">
        <div class="heading">Getting the visitor identifier...</div>
      </section>
    </div>
  </div>
  
  <!-- Email Overlay -->
  <div class="overlay" id="emailOverlay">
    <div class="overlay-content">
      <h2>Welcome</h2>
      <p>Please enter your email to continue:</p>
      <input type="email" id="userEmail" placeholder="Your email address" required>
      <div id="errorMessage" class="error-message">Please enter a valid email address</div>
      <button id="submitEmail">Continue</button>
    </div>
  </div>

  <script>
    // JavaScript to handle the overlay and prevent proceeding without a valid email
    document.addEventListener('DOMContentLoaded', function() {
      const overlay = document.getElementById('emailOverlay');
      const submitButton = document.getElementById('submitEmail');
      const emailInput = document.getElementById('userEmail');
      const errorMessage = document.getElementById('errorMessage');
      const mainContent = document.querySelector('.content');
      
      // Function to validate email format
      function isValidEmail(email) {
        // Regular expression for basic email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
      
      // Function to validate and process the email
      function processEmail() {
        const email = emailInput.value.trim();
        
        if (email && isValidEmail(email)) {
          // Store the email in localStorage for persistence
          localStorage.setItem('userEmail', email);
          
          // Show the main content
          mainContent.classList.remove('content-hidden');
          
          // Hide the overlay
          overlay.style.display = 'none';
          
          // Update the heading to show the email
          document.querySelector('.output .heading').textContent = 
            `Welcome! Getting the visitor identifier for ${email}...`;
            
          return true;
        } else {
          // Show appropriate error message
          if (!email) {
            errorMessage.textContent = "Please enter your email address";
          } else {
            errorMessage.textContent = "Please enter a valid email address";
          }
          
          errorMessage.style.display = 'block';
          emailInput.focus();
          return false;
        }
      }
      
      // Submit button click handler
      submitButton.addEventListener('click', processEmail);
      
      // Allow pressing Enter to submit
      emailInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          processEmail();
        }
      });
      
      // Hide error message when user starts typing
      emailInput.addEventListener('input', function() {
        errorMessage.style.display = 'none';
      });
      
      // Prevent overlay from being closed without a valid email
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          e.stopPropagation();
          emailInput.focus();
        }
      });
      
      // Focus on input field when page loads
      emailInput.focus();
      
      // Check if we already have a saved email
      const savedEmail = localStorage.getItem('userEmail');
      if (savedEmail) {
        // If email exists, pre-fill the input
        emailInput.value = savedEmail;
        
        // Let the user confirm their email - uncomment to auto-proceed with saved email
        // processEmail();
      }
    });
  </script>
</body>
</html>
